<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        /* .container styles defined below */
        /* flexbox is used to create a layout for web page  */
       /* main {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
        } */
       .container{
            /* display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px; */
            height: 20px;
            width: 20px;
            border: 7px solid rgb(218, 57, 57);
      
        }
        .box{
            flex:  10px;
            min-width: 80px;
            height: 12px;
            width: 12px;
            margin: 5px;
            display: flex;
         
            border: 2px solid #b82c2c;
        }
    </style>
</head>
<body>
    
    <main>
        <div class="container"></div>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </main>


</body>
</html>
