<script>

var b = 5;

document.write(c);
document.write("<br>");
var d = 20;
var e = 3;
var f = d - e;
document.write(f);
document.write("<br>");
var g = 20;
var h = 3;
var i = g * h;
document.write(i);
document.write("<br>");
var j = 20;
var k = 3;
var l = j ** k;
document.write(l);
document.write("<br>");
var m = 20;
var n = 3;
var o = m / n;
document.write(o);
document.write("<br>");
var p = 20;
var q = 3;
var r = p % q;
document.write(r);
document.write("<br>");
