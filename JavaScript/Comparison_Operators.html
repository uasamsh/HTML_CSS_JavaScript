<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparison operators</title>
<script>
// Comparison oprators will be just ture or false,  ==, ===,!=,!==, >, <, >=, <=, shortcut of comparison operators
var a = 10;
var b = 5;
document.write(a == b); // false
document.write("<br>");
document.write(a != b); // true
document.write("<br>");
document.write(a > b); // true
document.write("<br>");
document.write(a < b); // false
document.write("<br>");
document.write(a >= b); // true
document.write("<br>");
document.write(a <= b); // false

// id data types not same then false
console.log(a==="b"); // false
console.log(a!=="b"); // true

    
</script>

</head>
<body>
    
</body>
</html>
