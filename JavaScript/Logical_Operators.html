<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical operators</title>
<script>
//Logical operators && AND , || OR, ! NOT   using if  , else if
var a = 10;
var b = 20;
var c = 30;
if (a > b && a > c) {
    console.log("a is greater than b and c");
}
else if (b > a && b > c) {
    console.log("b is greater than a and c");
}
else {
    console.log("c is greater than a and b");
}

// Logical operators &&, ||, !, shortcut of logical operators
var a = 10;
var b = 5;
document.write(a > b && a < 20); // true
document.write("<br>");
document.write(a > b || a < 20); // true
document.write("<br>");
document.write(!(a > b)); // false
</script>
</head>
<body>
    
</body>
</html>
