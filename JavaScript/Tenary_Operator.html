<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenary operator</title>

<script>
//  tenary operator  ?: shortcut of if , else if
var a = 10;
var b = 5;
document.write(a > b ? "a is greater than b" : "b is greater than a");
document.write("<br>");


</script>


</head>
